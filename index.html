  <!doctype html>
<html lang="en" data-direction="editorial" data-mode="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Josep Rodon — Portfolio</title>
<link rel="stylesheet" href="css/colors_and_type.css"/>
<link rel="stylesheet" href="css/app.css?v=4"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="data.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "direction": "editorial",
  "accent": "ink",
  "displayFont": "grotesk",
  "homeStyle": "carousel",
  "menuLayout": "strip",
  "darkMode": false
}/*EDITMODE-END*/;

const ACCENT_MAP = {
  red:    { var: "var(--accent-red)",    label: "Burnt clay" },
  yellow: { var: "var(--accent-yellow)", label: "Signal yellow" },
  ink:    { var: "var(--accent-ink)",    label: "Pure ink" },
  clay:   { var: "var(--accent-clay)",   label: "Terracotta" }
};
const FONT_MAP = {
  grotesk:  "var(--font-sans)",
  serif:    "var(--font-display)",
  mono:     "var(--font-mono)"
};
const DIR_LABEL = {
  editorial: "Editorial",
  architectural: "Architectural",
  experimental: "Experimental"
};

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = useState("home");
  const [openId, setOpenId] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [lang, setLang] = useState("ca");
  const [isMobile, setIsMobile] = useState(window.innerWidth <= 640);
  // Apply runtime CSS tokens
  useEffect(() => {
    document.documentElement.setAttribute("data-direction", tweaks.direction);
    document.documentElement.setAttribute("data-mode", tweaks.darkMode ? "dark" : "light");
    document.documentElement.style.setProperty("--t-accent", ACCENT_MAP[tweaks.accent]?.var || ACCENT_MAP.red.var);
    document.documentElement.style.setProperty("--t-display", FONT_MAP[tweaks.displayFont] || FONT_MAP.grotesk);
  }, [tweaks]);

  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth <= 640);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, []);

  // El home fusiona hero + projectes: "menu" hi porta fent scroll, no canviant de pàgina
  const homeHasStrip = !isMobile && tweaks.homeStyle === "carousel" && tweaks.menuLayout === "strip";

  // En obrir un projecte es recorda on eres, per tornar-hi exactament
  const tornadaRef = useRef(0);
  const onOpen = (id) => {
    if (page === "home" || page === "menu") tornadaRef.current = window.scrollY;
    setOpenId(id); setPage("project"); window.scrollTo({ top: 0 });
  };
  const onBack = () => {
    setOpenId(null);
    setPage("home");
    const y = tornadaRef.current;
    // dos fotogrames: el primer dibuixa el home, el segon ja té l'alçada bona
    requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, y)));
  };
  const onNav = (p) => {
    if (p === "menu" && homeHasStrip) {
      const toStrip = () => window.scrollTo({ top: window.innerHeight * HOME_ENTER_VH, behavior: "smooth" });
      setOpenId(null);
      if (page === "home") { toStrip(); }
      else { setPage("home"); window.scrollTo({ top: 0 }); requestAnimationFrame(() => requestAnimationFrame(toStrip)); }
      return;
    }
    setPage(p); setOpenId(null); window.scrollTo({ top: 0 });
  };
  const project = window.PROJECTS.find(p => p.id === openId);

  return (
    <>
      <Nav
        page={page}
        onNav={onNav}
        lang={lang}
        accentYellow={tweaks.accent === "yellow"}
        onMenu={() => { if (!isMobile) { setMenuOpen(true); } }}
      />

      {page === "home" && !isMobile && (
        tweaks.homeStyle === "carousel"
          ? <main className="page" key="home-carousel">
              {tweaks.menuLayout === "strip"
                ? <HomeStage projects={window.PROJECTS} onOpen={onOpen} lang={lang} onNav={onNav} />
                : <HeroCarousel projects={window.PROJECTS} onOpen={onOpen} lang={lang} onNav={onNav} />}
            </main>
          : <main className="page" key="home-sparse"><HomeSparse onNav={onNav} lang={lang} /></main>
      )}

      {isMobile && page !== "project" && (
        <main className="page" key="home-mobile"><MobileHome lang={lang} onOpen={onOpen} onNav={onNav} /></main>
      )}

      {page === "menu" && !isMobile && tweaks.menuLayout === "strip" && (
        <main className="page" key="menu-strip">
          <StripMenu onOpen={onOpen} lang={lang} onNav={onNav} />
        </main>
      )}

      {page === "menu" && !isMobile && tweaks.menuLayout !== "strip" && (
        <main className="page" key={"menu" + tweaks.menuLayout}>
          <MenuGrid onOpen={onOpen} lang={lang} layout={tweaks.menuLayout} />
        </main>
      )}

      {page === "project" && project && (
        <main className="page" key={"proj" + openId}>
          <ProjectDetail project={project} onOpen={onOpen} onBack={onBack} lang={lang} />
        </main>
      )}

      {page === "about" && (
        <main className="page" key="about">
          <About lang={lang} />
        </main>
      )}

      <Clock />
      <LangSwitch lang={lang} onLang={setLang} />

      <MenuOverlay
        open={menuOpen}
        onClose={() => setMenuOpen(false)}
        onOpen={onOpen}
        onNav={onNav}
        lang={lang}
      />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Visual direction" />
        <TweakRadio
          label="Direction"
          value={tweaks.direction}
          onChange={(v) => setTweak('direction', v)}
          options={[
            { value: "architectural", label: "Arch" },
            { value: "editorial", label: "Edit" },
            { value: "experimental", label: "Exp" }
          ]}
        />

        <TweakSection label="Accent" />
        <TweakRadio
          label="Color"
          value={tweaks.accent}
          onChange={(v) => setTweak('accent', v)}
          options={[
            { value: "red", label: "Clay" },
            { value: "yellow", label: "Yellow" },
            { value: "ink", label: "Ink" },
            { value: "clay", label: "Terra" }
          ]}
        />

        <TweakSection label="Typography" />
        <TweakRadio
          label="Display font"
          value={tweaks.displayFont}
          onChange={(v) => setTweak('displayFont', v)}
          options={[
            { value: "grotesk", label: "DM Sans" },
            { value: "serif", label: "Serif" },
            { value: "mono", label: "Mono" }
          ]}
        />

        <TweakSection label="Layout" />
        <TweakRadio
          label="Homepage"
          value={tweaks.homeStyle}
          onChange={(v) => setTweak('homeStyle', v)}
          options={[
            { value: "carousel", label: "Carousel" },
            { value: "sparse", label: "Sparse" }
          ]}
        />
        <TweakRadio
          label="Menu"
          value={tweaks.menuLayout}
          onChange={(v) => setTweak('menuLayout', v)}
          options={[
            { value: "strip", label: "Strip" },
            { value: "grid", label: "Grid" },
            { value: "list", label: "List" },
            { value: "columns", label: "Cols" }
          ]}
        />

        <TweakSection label="Mode" />
        <TweakToggle
          label="Dark mode"
          value={tweaks.darkMode}
          onChange={(v) => setTweak('darkMode', v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
